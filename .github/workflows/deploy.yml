name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the build to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead, and let an in-flight run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Typecheck runs as part of `build`, so a type error fails the deploy.
      - run: npm run build

      # enablement:true asks the Pages API to set build_type to "workflow".
      # Without it, a repo whose Pages source is "Deploy from a branch" keeps
      # running the legacy Jekyll builder against the repo root — which
      # publishes the dev index.html (a <script src="/src/main.tsx"> the
      # browser cannot execute) and silently overwrites this deploy.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
